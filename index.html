<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thi thử · Tóm lược Quy trình – Quy định</title>
<style>
:root{--navy:#14284b;--navy2:#1d3a6b;--teal:#0f8a7e;--teal2:#14a597;--bg:#f3f5f9;--card:#fff;--ink:#1b2333;--mut:#667085;--line:#e3e7ef;--ok:#11875d;--okbg:#e7f6ef;--bad:#c2372f;--badbg:#fdeceb;--warn:#b26a00;--warnbg:#fff4e0}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
header{background:linear-gradient(120deg,var(--navy),var(--navy2) 55%,var(--teal));color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.15)}
header .row{display:flex;align-items:center;gap:12px;max-width:960px;margin:0 auto}
header .logo{font-weight:800;letter-spacing:.5px;background:#fff;color:var(--navy);border-radius:8px;padding:4px 8px;font-size:14px}
header h1{font-size:17px;margin:0;font-weight:700;flex:1}
header .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:8px}
header .timer.low{background:#c2372f}
main{max-width:960px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(16,24,40,.04)}
.hero{background:linear-gradient(120deg,var(--navy),var(--teal));color:#fff;border:none}
.hero h2{margin:0 0 6px;font-size:22px}
.hero .slogan{opacity:.9;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;transition:.15s}
.tile:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(15,138,126,.15)}
.tile b{display:block;font-size:17px;margin-bottom:4px;color:var(--navy)}
.tile span{color:var(--mut);font-size:14px}
.btn{display:inline-block;border:none;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--teal);color:#fff}
.btn:hover{background:var(--teal2)}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--teal)}
.btn.dark{background:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:#fff;font-size:14px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.muted{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef2f8;color:var(--navy2);margin-right:6px}
.q{font-size:18px;font-weight:600;margin:6px 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer;background:#fff}
.opt:hover{border-color:#b8c3d6}
.opt .k{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid #b8c3d6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--mut)}
.opt.sel{border-color:var(--navy);background:#f1f5fc}
.opt.sel .k{background:var(--navy);color:#fff;border-color:var(--navy)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.lock{cursor:default}
.exp{border-left:4px solid var(--teal);background:#f2faf9;padding:10px 12px;border-radius:8px;margin-top:10px;font-size:15px}
.exp.bad{border-color:var(--bad);background:#fff6f5}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.nav button{height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--ink)}
.nav button.done{background:#e8eef9;border-color:#b9c8e6}
.nav button.cur{outline:2px solid var(--teal);outline-offset:1px}
.nav button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.nav button.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.nav button.flag{box-shadow:inset 0 -4px 0 var(--warn)}
.bar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
textarea{width:100%;min-height:220px;border:1.5px solid var(--line);border-radius:10px;padding:12px;font:inherit;resize:vertical}
.warn{background:var(--warnbg);color:var(--warn);border:1px solid #f3d29a;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.score{font-size:44px;font-weight:800;line-height:1}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.kpi{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.kpi div{min-width:120px}
.kpi small{display:block;color:var(--mut);font-size:13px}
.kpi b{font-size:22px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.check input{margin-top:4px;transform:scale(1.2)}
.prog{height:8px;background:#e6eaf2;border-radius:99px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--navy2))}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.hide{display:none!important}
.small{font-size:13px}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}
.book .item{padding:10px 0;border-bottom:1px solid var(--line)}
.book .ans{color:var(--ok);font-weight:600}
@media (max-width:600px){main{padding:12px} .q{font-size:17px} header h1{font-size:15px}}
</style>
</head>

["D1.4","Trình bày 4 cấp độ phân loại lỗi trong Quy trình An toàn – Chất lượng – Tiến độ, cách xử lý và ví dụ.",["Cấp 1 – Nhẹ: nhắc nhở trực tiếp/trên nhóm → BCH khắc phục, phản hồi (VD: tracking nộp chậm)","Cấp 2 – Trung bình: Thông báo công việc không phù hợp → BCH gửi Báo cáo phản hồi (VD: trượt tiến độ nội bộ cùng hạng mục > 3 lần liên tiếp)","Cấp 3 – Nghiêm trọng: Biên bản làm việc, xác định trách nhiệm, cảnh cáo/xử phạt, có thể dừng công việc (VD: làm việc trên cao không chống rơi, thiết bị hết kiểm định, bê tông không đạt cường độ)","Cấp 4 – Đặc biệt nghiêm trọng/sự cố: dừng ngay, cấp cứu, bảo vệ hiện trường, QĐ kỷ luật BCH","Quá hạn khắc phục hoặc tái diễn → nâng lên cấp độ kế tiếp"]]
];

</script>
<script>
"use strict";
const GROUPS={A:"A · Khối HCNS-TH",B:"B · Khối KT-KH",C:"C · Khối TC-KT",D:"D · Ban Kiểm soát"};
const SECNAME={"A1":"Nội quy, nhân sự & chế độ","A2":"Vận hành & chi phí","A3":"Vật tư, công nhật, quỹ & xử phạt","B1":"Hộ kinh doanh & Tổ đội","B2":"Nhà cung cấp & Hợp Nhân","B3":"Thầu phụ","B4":"Doanh thu – Chi phí","C1":"Hóa đơn & chứng từ","C2":"Hợp đồng HKD & thuế TNCN","C3":"Tạm ứng, thanh toán & bảo lãnh","D1":"An toàn – Chất lượng – Tiến độ","D2":"Thẻ an toàn & Nhân lực","D3":"Quy trình, thông báo khác"};
const EXAM_MIX={A:5,B:5,C:4,D:4}; // 18 câu trắc nghiệm
const MCQ_PT=5, ESSAY_PT=10, PASS=85, EXAM_MIN=30;
const Q=BANK.map((r,i)=>({id:"q"+i,sec:r[0],g:r[0]==="TB58"?"T":r[0][0],q:r[1],opts:r[2],e:r[3]}));
const E=ESSAYS.map((r,i)=>({id:"e"+i,sec:r[0],q:r[1],keys:r[2],model:r[3]||r[2].join(". ")}));
const $=s=>document.querySelector(s);
const app=$("#app");
function ask(msg,yes,okOnly){const d=$("#dlg");$("#dlgMsg").textContent=msg;const y=$("#dlgYes"),n=$("#dlgNo");n.style.display=okOnly?"none":"";y.textContent=okOnly?"Đóng":"Đồng ý";d.classList.remove("hide");y.onclick=()=>{d.classList.add("hide");if(yes)yes()};n.onclick=()=>d.classList.add("hide")}
function note(msg,then){ask(msg,then,true)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function secLabel(s){const k=s==="TB58"?"TB":s.slice(0,2);return (s==="TB58"?"TB 58":s)+" · "+(SECNAME[k]||"")}
// storage (an toàn)
const store={get(k,d){try{const v=localStorage.getItem("ctl3_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("ctl3_"+k,JSON.stringify(v))}catch(e){}}};
let WRONG=store.get("wrong",{}); // id -> count
let HIST=store.get("hist",[]);
function saveWrong(){store.set("wrong",WRONG)}
function markWrong(id){WRONG[id]=(WRONG[id]||0)+1;saveWrong()}
function markRight(id){if(WRONG[id]){delete WRONG[id];saveWrong()}}
// mỗi câu: thứ tự đáp án xáo trộn
function prep(q){const order=shuffle([0,1,2,3]);return {...q,order,ans:order.indexOf(0),pick:null,flag:false}}
let timerInt=null;
function stopTimer(){clearInterval(timerInt);timerInt=null;$("#timer").classList.add("hide")}
function setTitle(t){$("#htitle").textContent=t}

// ================= HOME =================
function home(){
  stopTimer();setTitle("Thi thử · Chuẩn Thủ lĩnh – Vững Quy trình");
  const nW=Object.keys(WRONG).length;
  const last=HIST.slice(-5).reverse();
  app.innerHTML=`
  <div class="card hero"><h2>“Chuẩn Thủ lĩnh – Vững Quy trình”</h2>
   <div class="slogan">Hiểu đúng văn hóa · Nắm chắc quy trình · Thực thi chuẩn mực</div>
   <div class="small" style="margin-top:10px;opacity:.9">Nội dung: Tóm lược Quy trình – Quy định · 19 câu (18 trắc nghiệm + 1 tự luận) · 30 phút · Đạt ≥ 85%</div></div>
  <div class="grid">
   <div class="tile" onclick="startExam()"><b>📝 Thi thử như thật</b><span>Bốc ngẫu nhiên 18 câu trắc nghiệm + 1 tự luận, đếm ngược 30 phút, chấm điểm và giải thích.</span></div>
   <div class="tile" onclick="practiceSetup()"><b>🎯 Luyện tập theo chủ đề</b><span>Trả lời từng câu, xem ngay đáp án và giải thích. Ngân hàng ${Q.length} câu.</span></div>
   <div class="tile" onclick="${nW?"startPractice('wrong')":""}" style="${nW?"":"opacity:.55;cursor:default"}"><b>🔁 Ôn câu đã sai (${nW})</b><span>${nW?"Làm lại các câu từng sai, trả lời đúng sẽ tự xóa khỏi danh sách.":"Chưa có câu sai nào được lưu."}</span></div>
   <div class="tile" onclick="essayBank()"><b>✍️ Ôn tự luận (${E.length} đề)</b><span>Đề tự luận kèm các ý chính và đáp án mẫu để học thuộc.</span></div>
   <div class="tile" onclick="book()"><b>📒 Sổ tay đáp án</b><span>Xem toàn bộ câu hỏi và đáp án đúng theo từng mục để học nhanh.</span></div>
  </div>
  ${last.length?`<div class="card" style="margin-top:14px"><b>Lịch sử thi thử gần đây</b><table><tr><th>Thời gian</th><th>Trắc nghiệm</th><th>Tổng điểm</th><th>Kết quả</th></tr>${last.map(h=>`<tr><td>${esc(h.t)}</td><td>${h.c}/18</td><td>${h.s}/100</td><td class="${h.s>=PASS?"pass":"fail"}"><b>${h.s>=PASS?"Đạt":"Chưa đạt"}</b></td></tr>`).join("")}</table></div>`:""}
  <p class="muted small">Cách tính điểm thi thử (giả định): mỗi câu trắc nghiệm ${MCQ_PT} điểm (18 câu = 90 điểm), câu tự luận ${ESSAY_PT} điểm, tổng 100 điểm. Câu tự luận tự chấm bằng cách tích các ý đã viết đúng.</p>`;
}

// ================= EXAM =================
let X=null;
function pickExam(){
  let out=[];
  for(const g in EXAM_MIX){out=out.concat(shuffle(Q.filter(q=>q.g===g)).slice(0,EXAM_MIX[g]))}
  // đủ 18 câu, tránh trùng mục quá nhiều
  return shuffle(out).map(prep);
}
function startExam(){
  X={qs:pickExam(),essay:E[Math.floor(Math.random()*E.length)],essayText:"",i:0,end:Date.now()+EXAM_MIN*60000,leave:0,strict:false,done:false};
  $("#timer").classList.remove("hide");
  clearInterval(timerInt);timerInt=setInterval(tick,500);tick();
  setTitle("Đang thi thử");
  renderExam();
}
function tick(){
  if(!X||X.done)return;
  const ms=Math.max(0,X.end-Date.now());const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);
  const t=$("#timer");t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  t.classList.toggle("low",ms<5*60000);
  if(ms<=0){submitExam(true)}
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&X&&!X.done){X.leave++;if(X.strict){submitExam(false,"Bài tự nộp vì bạn rời màn hình (chế độ nghiêm).")}else{const w=$("#leavewarn");if(w){w.classList.remove("hide");w.textContent="⚠️ Bạn đã rời màn hình "+X.leave+" lần. Khi thi thật, chỉ cần rời màn hình 1 lần là bài tự kết thúc và nộp."}}}
});
function renderExam(){
  const n=X.qs.length+1, i=X.i, isEssay=i===X.qs.length;
  const answered=X.qs.filter(q=>q.pick!==null).length+(X.essayText.trim()?1:0);
  let body="";
  if(!isEssay){
    const q=X.qs[i];
    body=`<div class="muted small">Câu ${i+1}/${n} · Trắc nghiệm</div><div class="q">${esc(q.q)}</div>
    ${q.order.map((oi,k)=>`<div class="opt ${q.pick===k?"sel":""}" onclick="pickX(${k})"><span class="k">${"ABCD"[k]}</span><span>${esc(q.opts[oi])}</span></div>`).join("")}
    <label class="small muted" style="display:inline-flex;gap:6px;margin-top:8px;cursor:pointer"><input type="checkbox" ${q.flag?"checked":""} onchange="X.qs[${i}].flag=this.checked;renderNav()"> Đánh dấu xem lại</label>`;
  }else{
    body=`<div class="muted small">Câu ${n}/${n} · Tự luận (${ESSAY_PT} điểm)</div><div class="q">${esc(X.essay.q)}</div>
    <textarea id="essay" placeholder="Viết câu trả lời của bạn…" oninput="X.essayText=this.value;renderNav()">${esc(X.essayText)}</textarea>`;
  }
  app.innerHTML=`
  <div id="leavewarn" class="warn ${X.leave?"":"hide"}">⚠️ Bạn đã rời màn hình ${X.leave} lần. Khi thi thật, chỉ cần rời màn hình 1 lần là bài tự kết thúc và nộp.</div>
  <div class="card">${body}
   <div class="bar" style="margin-top:16px"><button class="btn sec" onclick="go(-1)" ${i===0?"disabled":""}>← Câu trước</button>
   <span class="muted small">Đã làm ${answered}/${n}</span>
   ${i<n-1?`<button class="btn" onclick="go(1)">Câu sau →</button>`:`<button class="btn dark" onclick="confirmSubmit()">Nộp bài</button>`}</div></div>
  <div class="card"><div class="bar" style="margin-bottom:10px"><b>Danh sách câu</b>
   <label class="small" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" ${X.strict?"checked":""} onchange="X.strict=this.checked"> Chế độ nghiêm: rời màn hình là tự nộp</label></div>
   <div class="nav" id="nav"></div>
   <div style="margin-top:12px;text-align:right"><button class="btn dark" onclick="confirmSubmit()">Nộp bài</button> <button class="btn sec" onclick="ask('Hủy bài thi này?',home)">Hủy</button></div></div>`;
  renderNav();
}
function renderNav(){
  const nav=$("#nav");if(!nav)return;
  const n=X.qs.length+1;let h="";
  for(let k=0;k<n;k++){const done=k<X.qs.length?X.qs[k].pick!==null:X.essayText.trim()!=="";const fl=k<X.qs.length&&X.qs[k].flag;
    h+=`<button class="${done?"done":""} ${k===X.i?"cur":""} ${fl?"flag":""}" onclick="jump(${k})">${k===n-1?"TL":k+1}</button>`}
  nav.innerHTML=h;
}
function pickX(k){X.qs[X.i].pick=k;renderExam()}
function go(d){X.i=Math.min(X.qs.length,Math.max(0,X.i+d));renderExam();window.scrollTo(0,0)}
function jump(k){X.i=k;renderExam();window.scrollTo(0,0)}
function confirmSubmit(){
  const left=X.qs.filter(q=>q.pick===null).length+(X.essayText.trim()?0:1);
  ask(left?`Còn ${left} câu chưa làm. Vẫn nộp bài?`:"Nộp bài?",()=>submitExam(false));
}
function submitExam(timeout,reason){
  if(!X||X.done)return;X.done=true;stopTimer();
  let c=0;X.qs.forEach(q=>{if(q.pick===q.ans){c++;markRight(q.id)}else markWrong(q.id)});
  X.correct=c;X.keysOk=X.essay.keys.map(()=>false);X.reason=timeout?"Hết giờ – bài đã tự nộp.":(reason||"");
  X.used=Math.min(EXAM_MIN*60000,EXAM_MIN*60000-(X.end-Date.now()));
  const d=new Date();X.stamp=d.toLocaleDateString("vi-VN")+" "+d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
  HIST.push({t:X.stamp,c,s:c*MCQ_PT});HIST=HIST.slice(-30);store.set("hist",HIST);
  renderResult();
}
function essayScore(){const k=X.keysOk.filter(Boolean).length;return Math.round(ESSAY_PT*k/X.essay.keys.length*10)/10}
function totalScore(){return Math.round((X.correct*MCQ_PT+essayScore())*10)/10}
function renderResult(){
  setTitle("Kết quả thi thử");
  const tot=totalScore(),pass=tot>=PASS;
  const mm=Math.floor(X.used/60000),ss=Math.floor(X.used%60000/1000);
  app.innerHTML=`
  ${X.reason?`<div class="warn">${esc(X.reason)}</div>`:""}
  <div class="card"><div class="kpi">
   <div><small>Tổng điểm</small><span class="score ${pass?"pass":"fail"}" id="tot">${tot}</span><span class="muted">/100</span></div>
   <div><small>Kết quả</small><b class="${pass?"pass":"fail"}" id="verdict">${pass?"ĐẠT (≥ 85)":"CHƯA ĐẠT (< 85)"}</b></div>
   <div><small>Trắc nghiệm</small><b>${X.correct}/18 · ${X.correct*MCQ_PT}đ</b></div>
   <div><small>Tự luận (tự chấm)</small><b id="es">${essayScore()}/${ESSAY_PT}</b></div>
   <div><small>Thời gian làm</small><b>${mm}:${String(ss).padStart(2,"0")}</b></div>
   <div><small>Rời màn hình</small><b class="${X.leave?"fail":""}">${X.leave} lần</b></div></div>
   <div class="prog"><i style="width:${tot}%"></i></div>
   <div class="small muted">Để đạt cần sai tối đa ${Math.floor((100-PASS)/MCQ_PT)} câu trắc nghiệm nếu tự luận đạt trọn ${ESSAY_PT} điểm.</div>
   <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="startExam()">Thi đề mới</button><button class="btn sec" onclick="retryWrongExam()">Làm lại các câu sai</button><button class="btn sec" onclick="home()">Trang chủ</button></div></div>
  <div class="card"><b>Câu tự luận – tự chấm</b><div class="q" style="font-size:16px">${esc(X.essay.q)}</div>
   <details ${X.essayText.trim()?"open":""}><summary>Bài làm của bạn</summary><div style="white-space:pre-wrap;background:#f7f8fb;border-radius:8px;padding:10px;margin-top:6px">${esc(X.essayText||"(bỏ trống)")}</div></details>
   <p class="small muted">Tích vào các ý chính bạn đã viết đúng (mỗi ý ${Math.round(ESSAY_PT/X.essay.keys.length*100)/100} điểm):</p>
   ${X.essay.keys.map((k,j)=>`<label class="check"><input type="checkbox" onchange="X.keysOk[${j}]=this.checked;updScore()"><span>${esc(k)}</span></label>`).join("")}
   <details style="margin-top:10px"><summary>Đáp án mẫu</summary><div class="exp">${esc(X.essay.model)}</div></details>
   <div class="small muted" style="margin-top:6px">Nguồn: ${esc(secLabel(X.essay.sec))}</div></div>
  <div class="card"><b>Chi tiết 18 câu trắc nghiệm</b>
   <div class="chips"><span class="chip on" id="fAll" onclick="filt(0)">Tất cả</span><span class="chip" id="fBad" onclick="filt(1)">Chỉ câu sai (${18-X.correct})</span></div>
   <div id="rev"></div></div>`;
  filt(0);
}
function updScore(){const t=totalScore(),p=t>=PASS;$("#tot").textContent=t;$("#tot").className="score "+(p?"pass":"fail");$("#es").textContent=essayScore()+"/"+ESSAY_PT;const v=$("#verdict");v.textContent=p?"ĐẠT (≥ 85)":"CHƯA ĐẠT (< 85)";v.className=p?"pass":"fail";const h=HIST[HIST.length-1];if(h&&h.t===X.stamp){h.s=t;store.set("hist",HIST)}}
function filt(b){
  $("#fAll").classList.toggle("on",!b);$("#fBad").classList.toggle("on",!!b);
  $("#rev").innerHTML=X.qs.map((q,i)=>{const ok=q.pick===q.ans;if(b&&ok)return"";
   return `<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div><span class="tag">${i+1}</span><span class="tag">${esc(q.sec==="TB58"?"TB 58":q.sec)}</span><b class="${ok?"pass":"fail"}">${ok?"✓ Đúng":(q.pick===null?"✗ Bỏ trống":"✗ Sai")}</b></div>
   <div class="q" style="font-size:16px">${esc(q.q)}</div>
   ${q.order.map((oi,k)=>`<div class="opt lock ${k===q.ans?"ok":(k===q.pick?"bad":"")}"><span class="k">${"ABCD"[k]}</span><span>${esc(q.opts[oi])}</span></div>`).join("")}
   <div class="exp ${ok?"":"bad"}"><b>Giải thích:</b> ${esc(q.e)}<div class="small muted">Nguồn: ${esc(secLabel(q.sec))}</div></div></div>`}).join("")||`<p class="pass"><b>Không có câu sai. Xuất sắc!</b></p>`;
}
function retryWrongExam(){const ids=X.qs.filter(q=>q.pick!==q.ans).map(q=>q.id);if(!ids.length){note("Không có câu sai.");return}startPractice("ids",ids)}

// ================= PRACTICE =================
let P=null;let selG=["A","B","C","D"];
function practiceSetup(){
  stopTimer();setTitle("Luyện tập theo chủ đề");
  const secs=[...new Set(Q.map(q=>q.sec==="TB58"?"TB":q.sec.slice(0,2)))];
  app.innerHTML=`<div class="card"><b>Chọn khối</b><div class="chips" id="gch">${Object.keys(GROUPS).map(g=>`<span class="chip ${selG.includes(g)?"on":""}" onclick="togG('${g}')">${GROUPS[g]} (${Q.filter(q=>q.g===g).length})</span>`).join("")}</div>
  <b>Hoặc chọn một nhóm cụ thể</b><div class="chips">${secs.map(s=>`<span class="chip" onclick="startPractice('sec','${s}')">${s==="TB"?"TB 58":s} · ${SECNAME[s]} (${Q.filter(q=>(q.sec==="TB58"?"TB":q.sec.slice(0,2))===s).length})</span>`).join("")}</div>
  <div style="margin-top:12px"><button class="btn" onclick="startPractice('groups')">Bắt đầu luyện (${Q.filter(q=>selG.includes(q.g)).length} câu)</button> <button class="btn sec" onclick="home()">Trang chủ</button></div></div>`;
}
function togG(g){selG=selG.includes(g)?selG.filter(x=>x!==g):selG.concat(g);if(!selG.length)selG=[g];practiceSetup()}
function startPractice(mode,arg){
  stopTimer();let list;
  if(mode==="wrong")list=Q.filter(q=>WRONG[q.id]);
  else if(mode==="ids")list=Q.filter(q=>arg.includes(q.id));
  else if(mode==="sec")list=Q.filter(q=>(q.sec==="TB58"?"TB":q.sec.slice(0,2))===arg);
  else list=Q.filter(q=>selG.includes(q.g));
  if(!list.length){note("Không có câu nào.",home);return}
  P={mode,qs:shuffle(list).map(prep),i:0,ok:0,bad:0};
  setTitle(mode==="wrong"?"Ôn câu đã sai":"Luyện tập");renderP();
}
function renderP(){
  const q=P.qs[P.i],n=P.qs.length,ans=q.pick!==null;
  app.innerHTML=`<div class="card"><div class="bar"><span class="muted small">Câu ${P.i+1}/${n} · <span class="tag">${esc(q.sec==="TB58"?"TB 58":q.sec)}</span></span><span class="small"><b class="pass">✓ ${P.ok}</b> · <b class="fail">✗ ${P.bad}</b></span></div>
  <div class="prog"><i style="width:${(P.i)/n*100}%"></i></div>
  <div class="q">${esc(q.q)}</div>
  ${q.order.map((oi,k)=>{let c="";if(ans){c="lock "+(k===q.ans?"ok":(k===q.pick?"bad":""))}return `<div class="opt ${c}" onclick="${ans?"":`pickP(${k})`}"><span class="k">${"ABCD"[k]}</span><span>${esc(q.opts[oi])}</span></div>`}).join("")}
  ${ans?`<div class="exp ${q.pick===q.ans?"":"bad"}"><b>${q.pick===q.ans?"Chính xác!":"Chưa đúng."}</b> ${esc(q.e)}<div class="small muted">Nguồn: ${esc(secLabel(q.sec))}</div></div>`:""}
  <div class="bar" style="margin-top:14px"><button class="btn sec" onclick="home()">Thoát</button>
  ${ans?(P.i<n-1?`<button class="btn" onclick="P.i++;renderP();window.scrollTo(0,0)">Câu tiếp →</button>`:`<button class="btn dark" onclick="endP()">Xem kết quả</button>`):`<span class="muted small">Chọn một đáp án</span>`}</div></div>`;
}
function pickP(k){const q=P.qs[P.i];q.pick=k;if(k===q.ans){P.ok++;markRight(q.id)}else{P.bad++;markWrong(q.id)}renderP()}
function endP(){const n=P.qs.length,pct=Math.round(P.ok/n*100);
  app.innerHTML=`<div class="card"><div class="kpi"><div><small>Tỷ lệ đúng</small><span class="score ${pct>=PASS?"pass":"fail"}">${pct}%</span></div><div><small>Đúng</small><b class="pass">${P.ok}</b></div><div><small>Sai</small><b class="fail">${P.bad}</b></div></div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${P.bad?`<button class="btn" onclick="startPractice('ids',${JSON.stringify(P.qs.filter(q=>q.pick!==q.ans).map(q=>q.id)).replace(/"/g,"&quot;")})">Làm lại ${P.bad} câu sai</button>`:""}<button class="btn sec" onclick="practiceSetup()">Chọn chủ đề khác</button><button class="btn sec" onclick="home()">Trang chủ</button></div></div>`;}

// ================= ESSAY BANK & BOOK =================
function essayBank(){
  stopTimer();setTitle("Ôn tự luận");
  app.innerHTML=`<div class="card"><button class="btn sec" onclick="home()">← Trang chủ</button></div>`+E.map((e,i)=>`<div class="card"><span class="tag">Đề ${i+1}</span><span class="tag">${esc(e.sec)}</span><div class="q" style="font-size:16px">${esc(e.q)}</div>
  <details><summary>Các ý chính cần có (${e.keys.length} ý)</summary><ol>${e.keys.map(k=>`<li>${esc(k)}</li>`).join("")}</ol></details>
  <details style="margin-top:6px"><summary>Đáp án mẫu</summary><div class="exp">${esc(e.model)}</div></details></div>`).join("");
}
function book(){
  stopTimer();setTitle("Sổ tay đáp án");
  const by={};Q.forEach(q=>{const k=q.sec==="TB58"?"TB":q.sec.slice(0,2);(by[k]=by[k]||[]).push(q)});
  app.innerHTML=`<div class="card"><button class="btn sec" onclick="home()">← Trang chủ</button> <span class="muted small">Đáp án đúng tô xanh. Dùng để đọc lướt trước khi thi.</span></div>`+
  Object.keys(by).map(k=>`<div class="card book"><b>${k==="TB"?"TB 58":k} · ${SECNAME[k]}</b>${by[k].map(q=>`<div class="item"><span class="tag">${esc(q.sec==="TB58"?"TB 58":q.sec)}</span>${esc(q.q)}<div class="ans">→ ${esc(q.opts[0])}</div><div class="small muted">${esc(q.e)}</div></div>`).join("")}</div>`).join("");
}
home();
</script>
